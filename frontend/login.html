<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goalflow Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <h2>Goalflow</h2>
    <p id="msg">login to goalflow and keep tracks of your expenses!!! <br>
        don't have an account? <a href="" id="signup">signup</a>
    </p>
    <div class="login">
        <p id="login-msg">Login Here</p>
        <input type="text" id="email" placeholder="Enter your email here...">
        <input type="password" name="password" id="password" placeholder="Enter your password...">
        <button id="loginBtn">Login</button>
    </div> 
    <p>why use Goalflow?</p>
</body>
</html>
