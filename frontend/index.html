<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goalflow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
    <!-- Sidepanel -->
    <aside class="side-panel">
        <h2>Goalflow</h2>
        <ul>
            <li>Overview</li>
            <li>Cards</li>
            <li>Budget</li>
            <li>Payments</li>
            <li>Analytics</li>
            <li>Settings</li>
            <a href="login.html" id="authLink"><li>Login / Signup</li></a>
        </ul>
    </aside>
    
    <main class="main">
        <!-- Header -->
        <header class="header">
            <input type="search" placeholder="Search.....">
            <div class="profile">User</div>
        </header>
        <!-- Section 1 -->
        <section class="status">
            <div class="item">
                <h3>Revenue</h3>
                <p id="revenueValue">₹0</p>
            </div>
            <div class="item">
                <h3>Expense</h3>
                <p id="expenseValue">₹0</p>
            </div>
            <div class="item">
                <h3>Balance</h3>
                <p id="balanceValue">₹0</p>
            </div>
            <div class="item action-card">
                <h3>Actions</h3>
                <button id="openIncomeModal">Add Income</button>
                <button id="openExpenseModal">Add Expense</button>
                <button id="openGoalModal">Add Goal</button>
            </div>
        </section>
        <!-- section 2-->
        <section class="cards">
            <div class="mycards">
                <h3>Expense Overview</h3>
                <div id="chartArea">chart here</div>
            </div>
            <div class="last-transactions">
                <h3>Last Transactions</h3>
                <div id="transactionList"></div>
            </div>
        </section>
        <!-- section 3-->
        <section class="activities">
            <h3>Expenses</h3>
            <div id="expenselist"></div>
        </section>
        <!-- section 4 -->
        <section class="transactions">
            <h3>Goals</h3>
            <div id="goalList"></div>
        </section>
    </main>
</div>
<div id="incomeModal" class="modal">
    <div class="modal-content">
        <h3>Add Income</h3>
        <input type="number" id="incomeAmount" placeholder="Amount">
        <input type="text" id="incomeSource" placeholder="Source / Category">
        <input type="date" id="incomeDate">
        <button id="saveIncomeBtn">Save Income</button>
    </div>
</div>

<div id="expenseModal" class="modal">
    <div class="modal-content">
        <h3>Add Expense</h3>
        <input type="number" id="expenseAmount" placeholder="Amount">
        <input type="text" id="expenseCategory" placeholder="Category">
        <input type="date" id="expenseDate">
        <button id="saveExpenseBtn">Save Expense</button>
    </div>
</div>

<div id="goalModal" class="modal">
    <div class="modal-content">
        <h3>Add Goal</h3>
        <input type="text" id="goalName" placeholder="Goal Name">
        <input type="number" id="goalTarget" placeholder="Target Amount">
        <button id="saveGoalBtn">Save Goal</button>
    </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
