<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goalflow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
    <!-- Sidepanel -->
    <aside class="side-panel">
        <h2>Goalflow</h2>
        <ul>
            <li>Overview</li>
            <li>Cards</li>
            <li>Budget</li>
            <li>Payments</li>
            <li>Analytics</li>
            <li>Settings</li>
        </ul>
    </aside>
    
    <main class="main">
        <!-- Header -->
        <header class="header">
            <input type="search" placeholder="Search.....">
            <div class="profile">User</div>
        </header>
        <!-- Section 1 -->
        <section class="status">
            <div class="item">Revenue</div>
            <div class="item">Expense</div>
            <div class="item">Balance</div>
            <div class="item">Growth</div>
        </section>
        <!-- section 2-->
        <section class="cards">
            <div class="mycards">my Cards</div>
            <div >last transactions</div>
        </section>
        <!-- section 3-->
        <section class="activities">Financial activities</section>
        <!-- section 4 -->
        <section class="transactions">Recent Transactions</section>
    </main>
</div>
<script src="script.js"></script>
</body>
</html>
